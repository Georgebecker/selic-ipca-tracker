services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./frontend:/app/frontend
    environment:
      - PYTHONUNBUFFERED=1
      - DB_URL=sqlite:///data/selic_ipca.db
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
