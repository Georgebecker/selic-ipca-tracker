name: CI

# Roda a cada push e pull request na master. Também pode ser disparado à mão.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  testes:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compilar os módulos
        run: python -m compileall -q src tests

      - name: Testes automatizados
        run: python -m pytest -q

      - name: Nenhum arquivo de segredo versionado
        run: |
          suspeitos=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$suspeitos" ]; then
            echo "BLOQUEADO: arquivo de segredo versionado:"
            echo "$suspeitos"
            exit 1
          fi
          echo "ok: nenhum .env versionado (só o .env.example, sem valores)"

  servico:
    name: A aplicacao sobe e responde
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Subir a API e conferir as rotas de leitura
        run: |
          python -m uvicorn src.api.main:app --host 127.0.0.1 --port 8000 &
          for tentativa in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/status > /dev/null 2>&1; then
              echo "servidor no ar na tentativa $tentativa"
              break
            fi
            sleep 1
          done

          echo "--- /status ---"
          curl -fsS http://127.0.0.1:8000/status

          echo ""
          echo "--- /series (inicio) ---"
          curl -fsS http://127.0.0.1:8000/series | head -c 300

          echo ""
          echo "--- /docs ---"
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:8000/docs

          echo "smoke ok: a aplicacao sobe, cria o banco e responde"
